# CI: a cada push e pull request, cinco verificações em paralelo (aba "Qualidade e CI/CD" do
# doc de requisitos, etapa 1). Os nomes dos trabalhos são os checks exigidos na main (etapa 2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que ficou desatualizada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RQ01: tipos dos três pacotes e dos testes de ponta a ponta.
  tipos:
    name: tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # RQ02: lint (Oxlint) com regras de hooks do React, promessas sem await e código morto.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # RQ04: regras (shared) e API (server), com cobertura mínima por pacote.
  testes:
    name: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Os cinco fluxos principais num navegador, contra o sistema completo num Postgres só de teste.
  ponta-a-ponta:
    name: ponta a ponta
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vanellis_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # RQ05: a imagem do servidor compila e sobe; o /api/health e o site respondem.
  docker:
    name: docker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compila a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vanellis-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe o contêiner (aplica as migrações ao iniciar)
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e PORT=3000 vanellis-app:ci
      - name: Confere que responde
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/painel/ | grep -q '<div id="root">'
          echo "Imagem ok: API, site e painel respondem."
      - name: Logs do contêiner
        if: always()
        run: docker logs app
