# Testes de mutação (etapa 3 da aba "Qualidade e CI/CD"). O resultado é determinístico: com o
# mesmo código e os mesmos testes, sai a mesma nota. Por isso o Stryker só roda quando muda o
# código mutado ou os testes dele, nunca por calendário:
#   - PR: o workflow roda em TODO PR, para poder ser verificação obrigatória da main (RQ22; com
#     filtro de caminhos no gatilho, um PR só de telas ficaria esperando para sempre). O primeiro
#     passo olha os arquivos alterados: se nenhum está em CAMINHOS (abaixo) ou o PR é do
#     Dependabot (RQ19), termina com sucesso em segundos. Senão, modo incremental, só as
#     mutações do que mudou (RQ18).
#   - merge na main com essas mudanças: atualiza a base que os próximos PRs reaproveitam.
#   - botão "Run workflow": execução completa, do zero (RQ20).
# Piso (RQ22): nota abaixo de thresholds.break em stryker.config.mjs reprova. A nota aparece no
# resumo da execução e o relatório navegável fica nos artefatos.
name: Mutação

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'shared/src/**'
      - 'shared/stryker.config.mjs'
      - 'shared/vitest.config.ts'
      - 'server/src/modules/**'
      - 'server/src/db/conversao*.ts'
      - 'server/stryker.config.mjs'
      - 'server/vitest.mutacao.config.ts'
      - '.github/workflows/mutacao.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutacao:
    name: mutação (${{ matrix.pacote }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pacote: [shared, server]
    steps:
      - uses: actions/checkout@v7

      # Precisa mutar? Os mesmos caminhos do gatilho de push, acima (mantenha os dois iguais).
      - name: Mudou código mutado ou os testes dele?
        id: mudou
        env:
          CAMINHOS: '^(shared/src/|shared/stryker\.config\.mjs$|shared/vitest\.config\.ts$|server/src/modules/|server/src/db/conversao[^/]*\.ts$|server/stryker\.config\.mjs$|server/vitest\.mutacao\.config\.ts$|\.github/workflows/mutacao\.yml$)'
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTOR: ${{ github.actor }}
        run: |
          if [ "$EVENTO" != pull_request ]; then
            echo "roda=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # RQ19: atualização de dependência não muda o nosso código; os testes normais bastam.
          if [ "$AUTOR" = 'dependabot[bot]' ]; then
            echo "PR do Dependabot: mutação dispensada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "roda=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE "$CAMINHOS"; then
            echo "roda=true" >> "$GITHUB_OUTPUT"
          else
            echo "Este PR não muda código mutado nem os testes dele: mutação dispensada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "roda=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.mudou.outputs.roda == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.mudou.outputs.roda == 'true'

      # Base do modo incremental: o resultado da última execução (da main ou deste PR).
      - uses: actions/cache@v6
        if: steps.mudou.outputs.roda == 'true'
        with:
          path: ${{ matrix.pacote }}/reports/stryker-incremental.json
          key: stryker-${{ matrix.pacote }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.pacote }}-

      - name: Stryker
        if: steps.mudou.outputs.roda == 'true'
        working-directory: ${{ matrix.pacote }}
        run: npx stryker run ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Nota no resumo da execução
        if: always() && steps.mudou.outputs.roda == 'true'
        working-directory: ${{ matrix.pacote }}
        run: |
          [ -f reports/mutation/mutation.json ] || exit 0
          node -e '
            const r = require("./reports/mutation/mutation.json");
            const linhas = [], total = { k: 0, s: 0, n: 0, t: 0 };
            for (const [arquivo, f] of Object.entries(r.files)) {
              const c = { k: 0, s: 0, n: 0, t: 0 };
              for (const m of f.mutants) {
                if (m.status === "Killed") c.k++;
                else if (m.status === "Timeout") c.t++;
                else if (m.status === "Survived") c.s++;
                else if (m.status === "NoCoverage") c.n++;
              }
              for (const k in c) total[k] += c[k];
              const nota = ((c.k + c.t) / Math.max(1, c.k + c.t + c.s + c.n)) * 100;
              linhas.push(`| ${arquivo} | ${nota.toFixed(1)}% | ${c.k + c.t} | ${c.s} | ${c.n} |`);
            }
            const nota = ((total.k + total.t) / Math.max(1, total.k + total.t + total.s + total.n)) * 100;
            console.log(`## Mutação (${process.env.PACOTE}): ${nota.toFixed(1)}%\n`);
            console.log("| Arquivo | Nota | Pegas | Sobreviveram | Sem teste |\n|---|---|---|---|---|");
            console.log(linhas.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
        env:
          PACOTE: ${{ matrix.pacote }}

      - uses: actions/upload-artifact@v7
        if: always() && steps.mudou.outputs.roda == 'true'
        with:
          name: mutacao-${{ matrix.pacote }}
          path: ${{ matrix.pacote }}/reports/mutation/
          retention-days: 14
