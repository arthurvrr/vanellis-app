# Produção: app + banco + HTTPS automático + backup noturno. Tudo que muda de um servidor
# para outro (domínio, senhas) vem do arquivo .env ao lado deste (modelo: .env.production.example).
#
#   docker compose up -d --build     sobe ou atualiza tudo (ou use deploy/deploy.sh)
#   docker compose logs -f app       acompanha o servidor
#   docker compose ps                situação dos serviços

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanellis
      POSTGRES_USER: vanellis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    # O banco não fica exposto na internet: só os outros containers enxergam.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vanellis -d vanellis']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: vanellis-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vanellis:${POSTGRES_PASSWORD}@db:5432/vanellis
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: vanellis
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vanellis
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      # Espera o app aplicar as migrações, para o primeiro backup já ter as tabelas.
      app:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
