# Produção: app + banco + HTTPS automático + backup noturno. Tudo que muda de um servidor
# para outro (domínio, senhas) vem do arquivo .env ao lado deste (modelo: .env.production.example).
#
#   docker compose up -d --build     sobe ou atualiza tudo (ou use deploy/deploy.sh)
#   docker compose logs -f app       acompanha o servidor
#   docker compose ps                situação dos serviços

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanellis
      POSTGRES_USER: vanellis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    # O banco não fica exposto na internet: só os outros containers enxergam.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vanellis -d vanellis']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    # No servidor, o CD aponta APP_IMAGE para a imagem pronta do GHCR (ghcr.io/...:<commit>) e sobe
    # sem compilar. Sem APP_IMAGE (teste local, deploy manual), compila aqui com o nome vanellis-app.
    image: ${APP_IMAGE:-vanellis-app}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vanellis:${POSTGRES_PASSWORD}@db:5432/vanellis
      BACKUP_DIR: /backups
    volumes:
      # Só leitura: o painel confere a data do último backup e o estado da cópia externa (RF67).
      - ./backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: vanellis
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vanellis
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      # Espera o app aplicar as migrações, para o primeiro backup já ter as tabelas.
      app:
        condition: service_healthy

  # Cópia dos backups para o Google Drive, criptografada (RQ35): envia os backups que o serviço
  # backup já conferiu e apaga do Drive os de mais de BACKUP_REMOTE_KEEP_DAYS dias. Fica desligada
  # até BACKUP_REMOTE ser definido no .env. Configuração: deploy/BACKUP-DRIVE.md.
  copia-externa:
    image: rclone/rclone:1.69.1
    restart: unless-stopped
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_KEEP_DAYS: ${BACKUP_REMOTE_KEEP_DAYS:-30}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      # rclone.conf com o acesso ao Drive e as senhas da criptografia (fora do git; ver o guia).
      - ./rclone:/config/rclone
      - ./deploy/copia-externa.sh:/copia-externa.sh:ro
    entrypoint: ['sh', '/copia-externa.sh']

volumes:
  db-data:
  caddy-data:
  caddy-config:
